# Build standalone executables of fancychords and fancyscales with
# PyInstaller (packaging/*.spec), for Linux and Windows (x86_64).
#
# - every run: tests, then build, then a smoke test of the executables
#   (run with the Python environment out of the way, to be sure they
#   work on their own); the executables are kept as workflow artifacts
#   (Actions tab -> the run -> Artifacts)
# - on a tag like v0.7: the executables are also attached to a GitHub
#   release for that tag
#
# The Linux build runs on Ubuntu 22.04 (glibc 2.35), so the executables
# also run on older distributions, ie Debian 12 (glibc 2.36) and Debian 13.

name: Build executables

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '*.py'
      - 'libs/**'
      - 'packaging/**'
      - 'tests/**'
      - 'fonts/**'
      - '.github/workflows/build-binaries.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
            exe: ''
          - os: windows-latest
            platform: windows-amd64
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'

      # ---- Cairo library (needed by cairosvg, bundled in the executables) ----

      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install Cairo (Windows, from MSYS2)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Put the Cairo DLLs in the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # libcairo-2.dll and the DLLs it needs are found through the PATH,
        # both by cairocffi and by PyInstaller when it collects them
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      # ---- Python packages, tests, build ----

      # python is called by its full path (from setup-python): on Windows the
      # MSYS2 Cairo package also installs an MSYS2 python.exe (without pip),
      # and the MSYS2 dir is now first in the PATH
      - name: Install Python packages
        shell: bash
        run: '"${{ steps.python.outputs.python-path }}" -m pip install svgwrite cairosvg pyinstaller'

      - name: Run the tests
        shell: bash
        run: '"${{ steps.python.outputs.python-path }}" -m unittest tests.test_chord_pipeline -v'

      - name: Build the executables
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" -m PyInstaller --noconfirm --clean packaging/fancychords.spec
          "${{ steps.python.outputs.python-path }}" -m PyInstaller --noconfirm --clean packaging/fancyscales.spec

      # ---- smoke test: the executables must work without Python and MSYS2 ----

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir smoke && cd smoke
          env -i PATH=/usr/bin:/bin ../dist/fancychords --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --root-diff -c -r enable -o out
          env -i PATH=/usr/bin:/bin ../dist/fancyscales ../assets/am_blues.txt --config_file=../assets/config_scales.json -c -o out
          ../dist/fancychords --version
          test -f "out/C Major.svg" && test -f "out/png/C Major.png"
          test -f "out/Am Blues Scale.svg" && test -f "out/png/Am Blues Scale.png"
          test -f out/fcreport.html

      # ---- font check: chords drawn with the Ubuntu Mono font (fonts/) must
      #      match reference png images made on Simone's computer ----

      - name: Install the Ubuntu Mono font (Linux)
        if: runner.os == 'Linux'
        run: |
          # system wide, so the executables find it also with an empty environment
          sudo mkdir -p /usr/local/share/fonts/ubuntu-font-family-0.83
          sudo cp fonts/ubuntu-font-family-0.83/UbuntuMono-*.ttf /usr/local/share/fonts/ubuntu-font-family-0.83/
          # 'Ubuntu Mono Legacy' (the name used in the svg files) -> 'Ubuntu Mono'
          sudo cp fonts/60-ubuntu-mono-legacy.conf /etc/fonts/conf.d/
          sudo fc-cache -f
          fc-match "Ubuntu Mono Legacy" | grep -q "Ubuntu Mono"

      # font check: the same chords drawn with font 'Ubuntu Mono Legacy' (the
      # default) and 'Ubuntu Mono' must be identical (the alias works), and
      # different from chords drawn with a font that does not exist (Ubuntu
      # Mono is really used); on Linux they must also look like Simone's
      # reference images (see tests/reference_png/compare_png.py)
      - name: Font check (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir fontcheck && cd fontcheck
          ref=../tests/reference_png
          draw() { env -i PATH=/usr/bin:/bin ../dist/fancychords --file_in=$ref/reference_chords.txt -c "$@" > /dev/null; }
          draw -o legacy
          draw -o real -ff "Ubuntu Mono"
          draw -o missing -cf $ref/missing_font.json
          py="${{ steps.python.outputs.python-path }}"
          "$py" $ref/compare_png.py --same legacy/png real/png
          "$py" $ref/compare_png.py --differ real/png missing/png
          "$py" $ref/compare_png.py legacy/png

      - name: Install the Ubuntu Mono font (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # install for the whole machine
          $reg = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          foreach ($f in Get-ChildItem fonts\ubuntu-font-family-0.83\UbuntuMono-*.ttf) {
            Copy-Item $f.FullName "$env:SystemRoot\Fonts\"
            $style = @{ 'UbuntuMono-R' = ''; 'UbuntuMono-B' = ' Bold'; 'UbuntuMono-RI' = ' Italic'; 'UbuntuMono-BI' = ' Bold Italic' }[$f.BaseName]
            New-ItemProperty -Path $reg -Name "Ubuntu Mono$style (TrueType)" -Value $f.Name -Force | Out-Null
          }

      # font check (Windows): chords drawn with 'Ubuntu Mono' must differ from
      # chords drawn with a font that does not exist (the installed font is
      # really used). The 'Ubuntu Mono Legacy' name is not checked here: Cairo
      # on Windows ignores the FontSubstitutes registry entry (checked in CI),
      # so on Windows the font must be chosen as 'Ubuntu Mono' (see fonts/)
      - name: Font check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = "${{ steps.python.outputs.python-path }}"
          $ref = "..\tests\reference_png"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory fontcheck | Out-Null
          Set-Location fontcheck
          ..\dist\fancychords.exe --file_in=$ref\reference_chords.txt -c -o real -ff "Ubuntu Mono" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancychords.exe --file_in=$ref\reference_chords.txt -c -o missing -cf $ref\missing_font.json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py $ref\compare_png.py --differ real\png missing\png
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # only the Windows system dirs in the PATH: Python and MSYS2 are
          # out of the way, so the bundled Cairo DLLs must be used
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory smoke | Out-Null
          Set-Location smoke
          ..\dist\fancychords.exe --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --root-diff -c -r enable -o out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancyscales.exe ..\assets\am_blues.txt --config_file=..\assets\config_scales.json -c -o out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancychords.exe --version
          foreach ($f in 'out\C Major.svg', 'out\png\C Major.png', 'out\Am Blues Scale.svg', 'out\png\Am Blues Scale.png', 'out\fcreport.html') {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }

      # ---- results ----

      - name: Upload the executables
        uses: actions/upload-artifact@v6
        with:
          name: pychords-${{ matrix.platform }}
          path: |
            dist/fancychords${{ matrix.exe }}
            dist/fancyscales${{ matrix.exe }}
          if-no-files-found: error

  release:
    # attach the executables to the GitHub release of a version tag (ie v0.7)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Make one archive per platform
        run: |
          cd artifacts
          for dir in pychords-*; do
            chmod +x "$dir"/fancy* || true
            if [ "$dir" = "pychords-windows-amd64" ]; then
              (cd "$dir" && zip -9 "../$dir-${GITHUB_REF_NAME}.zip" fancy*)
            else
              tar -C "$dir" -cJf "$dir-${GITHUB_REF_NAME}.tar.xz" fancychords fancyscales
            fi
          done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.xz
