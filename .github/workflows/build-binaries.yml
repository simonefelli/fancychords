# Build standalone executables of fancychords and fancyscales with
# PyInstaller (packaging/*.spec), for Linux and Windows (x86_64).
#
# - every run: tests, then build, then a smoke test of the executables
#   (run with the Python environment out of the way, to be sure they
#   work on their own); the executables are kept as workflow artifacts
#   (Actions tab -> the run -> Artifacts)
# - on a version tag like v0.7 or 0.7 (pushed, or made with a new GitHub
#   release): the executables are also attached to the GitHub release of
#   that tag (created if missing), one archive per platform with the font,
#   examples, LICENSE and README.txt (packaging/make_release_archive.sh)
#
# The Linux build runs on Ubuntu 22.04 (glibc 2.35), so the executables
# also run on older distributions, ie Debian 12 (glibc 2.36) and Debian 13.

name: Build executables

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*', '[0-9]*']
    paths:
      - '*.py'
      - 'libs/**'
      - 'packaging/**'
      - 'tests/**'
      - 'fonts/**'
      - 'assets/**'
      - '.github/workflows/build-binaries.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # which files changed? When they are all documentation (docs/, *.md,
  # assets/png/, the social preview image, LICENSE) the builds are skipped.
  # Version tags and manual runs always build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Look for changes other than documentation
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*)     range="$PR_BASE...$PR_HEAD" ;;
            push:refs/heads/*)  range="$PUSH_BEFORE...$GITHUB_SHA" ;;
            *)                  range='' ;;      # tags, manual runs: build
          esac
          base="${range%%...*}"
          if [ -z "$range" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "full build ($GITHUB_EVENT_NAME $GITHUB_REF)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files ($range):"
          git diff --name-only "$range" | sed 's/^/  /'
          docs='^(docs/|assets/png/|assets/social_preview\.png$|LICENSE$)|\.md$'
          if git diff --name-only "$range" | grep -v -E "$docs" | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only: builds skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
            exe: ''
          - os: windows-latest
            platform: windows-amd64
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'

      # ---- Cairo library (needed by cairosvg, bundled in the executables) ----

      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install Cairo (Windows, from MSYS2)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Put the Cairo DLLs in the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # libcairo-2.dll and the DLLs it needs are found through the PATH,
        # both by cairocffi and by PyInstaller when it collects them
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      # ---- Python packages, tests, build ----

      # python is called by its full path (from setup-python): on Windows the
      # MSYS2 Cairo package also installs an MSYS2 python.exe (without pip),
      # and the MSYS2 dir is now first in the PATH
      - name: Install Python packages
        shell: bash
        run: '"${{ steps.python.outputs.python-path }}" -m pip install svgwrite cairosvg pyinstaller'

      - name: Run the tests
        shell: bash
        run: '"${{ steps.python.outputs.python-path }}" -m unittest tests.test_chord_pipeline -v'

      - name: Build the executables
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" -m PyInstaller --noconfirm --clean packaging/fancychords.spec
          "${{ steps.python.outputs.python-path }}" -m PyInstaller --noconfirm --clean packaging/fancyscales.spec

      # ---- smoke test: the executables must work without Python and MSYS2 ----

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir smoke && cd smoke
          env -i PATH=/usr/bin:/bin ../dist/fancychords --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --root-diff -c -r enable -o out
          env -i PATH=/usr/bin:/bin ../dist/fancyscales ../assets/d_form.txt --config_file=../assets/config_scales.json -c -o out
          ../dist/fancychords --version
          test -f "out/C Major.svg" && test -f "out/png/C Major.png"
          test -f "out/D Form.svg" && test -f "out/png/D Form.png"
          test -f out/fcreport.html

      # ---- font check: chords drawn with the default font 'Ubuntu Mono
      #      derivative FChords' (fonts/) must match reference png images
      #      made on Simone's computer ----

      # the font files in the repository must be exactly the original Ubuntu
      # Mono 0.80 with only the names changed (rebuilt from the originals)
      - name: Check the FChords font files
        if: runner.os == 'Linux'
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install fonttools
          "${{ steps.python.outputs.python-path }}" fonts/make_fchords_font.py --check

      - name: Install the FChords font (Linux)
        if: runner.os == 'Linux'
        run: |
          # system wide, so the executables find it also with an empty environment
          sudo mkdir -p /usr/local/share/fonts/ubuntu-mono-derivative-fchords
          sudo cp fonts/ubuntu-mono-derivative-fchords/*.ttf /usr/local/share/fonts/ubuntu-mono-derivative-fchords/
          sudo fc-cache -f
          fc-match "Ubuntu Mono derivative FChords" | grep -q "Ubuntu Mono derivative FChords"

      # the chords drawn with the default font must differ from chords drawn
      # with a font that does not exist (the font is really installed and
      # used) and look like Simone's reference images (see
      # tests/reference_png/compare_png.py)
      - name: Font check (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir fontcheck && cd fontcheck
          ref=../tests/reference_png
          draw() { env -i PATH=/usr/bin:/bin ../dist/fancychords --file_in=$ref/reference_chords.txt -c "$@" > /dev/null; }
          draw -o default
          draw -o missing -cf $ref/missing_font.json
          py="${{ steps.python.outputs.python-path }}"
          "$py" $ref/compare_png.py --differ default/png missing/png
          "$py" $ref/compare_png.py default/png

      # the same with the newer Ubuntu Mono of Ubuntu 24.04 (fonts-ubuntu
      # 0.869, bolder and larger) installed too: the chords must not change
      - name: Font check with the Ubuntu 24.04 fonts too (Linux)
        if: runner.os == 'Linux'
        run: |
          deb=fonts-ubuntu_0.869+git20240321-0ubuntu1_all.deb
          curl -sSfLO "https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-ubuntu/$deb"
          echo "52c09a231239029c0b53167d7dffd0c9d6a714d5eaf83e758fc15c9718e3b653  $deb" | sha256sum -c
          dpkg-deb -x $deb noble-fonts
          sudo mkdir -p /usr/local/share/fonts/fonts-ubuntu-0.869
          sudo cp noble-fonts/usr/share/fonts/truetype/ubuntu/*.ttf /usr/local/share/fonts/fonts-ubuntu-0.869/
          sudo fc-cache -f
          cd fontcheck
          ref=../tests/reference_png
          py="${{ steps.python.outputs.python-path }}"
          env -i PATH=/usr/bin:/bin ../dist/fancychords --file_in=$ref/reference_chords.txt -c -o default2404 > /dev/null
          env -i PATH=/usr/bin:/bin ../dist/fancychords --file_in=$ref/reference_chords.txt -c -o new2404 -ff "Ubuntu Mono" > /dev/null
          "$py" $ref/compare_png.py --same default/png default2404/png
          # and the newer font is really installed and different
          "$py" $ref/compare_png.py --differ default2404/png new2404/png

      # the release archive (made only on version tags) must work too: build
      # it from this run's executables and follow its README.txt quick start
      - name: Release archive check (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/make_release_archive.sh dist linux-amd64 test archive-check
          cd archive-check
          tar -xJf fancychords-linux-amd64-test.tar.xz
          cd fancychords-linux-amd64-test
          test -f README.txt && test -f LICENSE && ls font/*.ttf examples/d_form.txt
          ./fancychords --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --convert > /dev/null
          ./fancyscales examples/d_form.txt --config_file=examples/config_scales.json --convert > /dev/null
          test -f "png/C Major.png" && test -f "png/D Form.png"

      - name: Install the FChords font (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # install for the whole machine
          $reg = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          $styles = @{ 'R' = ''; 'B' = ' Bold'; 'RI' = ' Italic'; 'BI' = ' Bold Italic' }
          foreach ($f in Get-ChildItem fonts\ubuntu-mono-derivative-fchords\*.ttf) {
            Copy-Item $f.FullName "$env:SystemRoot\Fonts\"
            $style = $styles[$f.BaseName.Split('-')[-1]]
            New-ItemProperty -Path $reg -Name "Ubuntu Mono derivative FChords$style (TrueType)" -Value $f.Name -Force | Out-Null
          }

      # font check (Windows): chords drawn with the default font must differ
      # from chords drawn with a font that does not exist (the font is really
      # installed and used)
      - name: Font check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = "${{ steps.python.outputs.python-path }}"
          $ref = "..\tests\reference_png"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory fontcheck | Out-Null
          Set-Location fontcheck
          ..\dist\fancychords.exe --file_in=$ref\reference_chords.txt -c -o default | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancychords.exe --file_in=$ref\reference_chords.txt -c -o missing -cf $ref\missing_font.json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py $ref\compare_png.py --differ default\png missing\png
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # only the Windows system dirs in the PATH: Python and MSYS2 are
          # out of the way, so the bundled Cairo DLLs must be used
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory smoke | Out-Null
          Set-Location smoke
          ..\dist\fancychords.exe --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --root-diff -c -r enable -o out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancyscales.exe ..\assets\d_form.txt --config_file=..\assets\config_scales.json -c -o out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancychords.exe --version
          foreach ($f in 'out\C Major.svg', 'out\png\C Major.png', 'out\D Form.svg', 'out\png\D Form.png', 'out\fcreport.html') {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }

      # ---- results ----

      - name: Upload the executables
        uses: actions/upload-artifact@v6
        with:
          name: fancychords-${{ matrix.platform }}
          path: |
            dist/fancychords${{ matrix.exe }}
            dist/fancyscales${{ matrix.exe }}
          if-no-files-found: error

  release:
    # attach the executables to the GitHub release of a version tag (ie v0.7 or 0.7)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # one archive per platform, with the executables, the font, examples,
      # LICENSE and a README.txt (see packaging/make_release_archive.sh)
      - name: Make one archive per platform
        run: |
          for platform in linux-amd64 windows-amd64; do
            packaging/make_release_archive.sh "artifacts/fancychords-$platform" "$platform" "$GITHUB_REF_NAME" release
          done
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.xz

  # the one check to require in the branch rules of main: it passes when
  # the builds passed, or were skipped because only documentation changed
  ci-ok:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, code changed: $CODE, build: $BUILD"
          if [ "$CHANGES" != success ]; then exit 1; fi
          if [ "$BUILD" = success ]; then exit 0; fi
          if [ "$BUILD" = skipped ] && [ "$CODE" = false ]; then exit 0; fi
          exit 1
