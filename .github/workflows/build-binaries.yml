# Build standalone executables of fancychords and fancyscales with
# PyInstaller (packaging/*.spec), for Linux and Windows (x86_64).
#
# - every run: tests, then build, then a smoke test of the executables
#   (run with the Python environment out of the way, to be sure they
#   work on their own); the executables are kept as workflow artifacts
#   (Actions tab -> the run -> Artifacts)
# - on a tag like v0.7: the executables are also attached to a GitHub
#   release for that tag
#
# The Linux build runs on Ubuntu 22.04 (glibc 2.35), so the executables
# also run on older distributions, ie Debian 12 (glibc 2.36) and Debian 13.

name: Build executables

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '*.py'
      - 'libs/**'
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/build-binaries.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
            exe: ''
          - os: windows-latest
            platform: windows-amd64
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ---- Cairo library (needed by cairosvg, bundled in the executables) ----

      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install Cairo (Windows, from MSYS2)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Put the Cairo DLLs in the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # libcairo-2.dll and the DLLs it needs are found through the PATH,
        # both by cairocffi and by PyInstaller when it collects them
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      # ---- Python packages, tests, build ----

      - name: Install Python packages
        run: python -m pip install svgwrite cairosvg pyinstaller

      - name: Run the tests
        run: python -m unittest tests.test_chord_pipeline -v

      - name: Build the executables
        run: |
          python -m PyInstaller --noconfirm --clean packaging/fancychords.spec
          python -m PyInstaller --noconfirm --clean packaging/fancyscales.spec

      # ---- smoke test: the executables must work without Python and MSYS2 ----

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir smoke && cd smoke
          env -i PATH=/usr/bin:/bin ../dist/fancychords --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --root-diff -c -r enable -o out
          env -i PATH=/usr/bin:/bin ../dist/fancyscales ../assets/am_blues.txt --config_file=../assets/config_scales.json -c -o out
          ../dist/fancychords --version
          test -f "out/C Major.svg" && test -f "out/png/C Major.png"
          test -f "out/Am Blues Scale.svg" && test -f "out/png/Am Blues Scale.png"
          test -f out/fcreport.html

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # only the Windows system dirs in the PATH: Python and MSYS2 are
          # out of the way, so the bundled Cairo DLLs must be used
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          New-Item -ItemType Directory smoke | Out-Null
          Set-Location smoke
          ..\dist\fancychords.exe --cli_in="C Major|x,3,2,0,1,0|x,3,2,x,1,x|x,R,3,5,R,3" --root-diff -c -r enable -o out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancyscales.exe ..\assets\am_blues.txt --config_file=..\assets\config_scales.json -c -o out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ..\dist\fancychords.exe --version
          foreach ($f in 'out\C Major.svg', 'out\png\C Major.png', 'out\Am Blues Scale.svg', 'out\png\Am Blues Scale.png', 'out\fcreport.html') {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }

      # ---- results ----

      - name: Upload the executables
        uses: actions/upload-artifact@v4
        with:
          name: pychords-${{ matrix.platform }}
          path: |
            dist/fancychords${{ matrix.exe }}
            dist/fancyscales${{ matrix.exe }}
          if-no-files-found: error

  release:
    # attach the executables to the GitHub release of a version tag (ie v0.7)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Make one archive per platform
        run: |
          cd artifacts
          for dir in pychords-*; do
            chmod +x "$dir"/fancy* || true
            if [ "$dir" = "pychords-windows-amd64" ]; then
              (cd "$dir" && zip -9 "../$dir-${GITHUB_REF_NAME}.zip" fancy*)
            else
              tar -C "$dir" -cJf "$dir-${GITHUB_REF_NAME}.tar.xz" fancychords fancyscales
            fi
          done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.xz
