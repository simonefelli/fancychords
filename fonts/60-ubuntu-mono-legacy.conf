<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  'Ubuntu Mono Legacy' (the default font name of fancychords/fancyscales)
  -> Ubuntu Mono version 0.80, the one of ubuntu-font-family-0.83.

  Recent systems (ie Ubuntu 24.04, package fonts-ubuntu 0.869) have a newer
  'Ubuntu Mono' (version 0.869, variable font with a Medium style) that draws
  bolder and larger characters. When both are installed:
  - the version is asked explicitly (fontversion 52428 = 0.80 in 16.16 fixed
    point), otherwise fontconfig prefers the newest one;
  - Cairo asks for weight 'medium' (100) for normal text: the old font has
    only Regular (80) and Bold (200), while the new one has a real Medium
    that would win before the version is looked at, so for this name medium
    is changed to regular.
  The name 'Ubuntu Mono' itself is not changed: it still gives the system's
  newest Ubuntu Mono to all the other programs.

  Install: ~/.config/fontconfig/conf.d/ (one user) or /etc/fonts/conf.d/
  (all users), then run fc-cache -f. See fonts/README.md.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Ubuntu Mono Legacy</string></test>
    <test name="weight" compare="eq"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Ubuntu Mono Legacy</string></test>
    <edit name="family" mode="assign" binding="same"><string>Ubuntu Mono</string></edit>
    <edit name="fontversion" mode="assign"><int>52428</int></edit>
  </match>
</fontconfig>
